- name: Run Android tests on emulator
  uses: reactivecircus/android-emulator-runner@v2
  with:
    api-level: 33
    target: google_apis
    arch: x86_64
    profile: pixel
    disable-animations: true
    emulator-boot-timeout: 900
    emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
    script: |
      set -eu

      echo "=== ADB recovery ==="
      adb kill-server || true
      adb start-server
      adb wait-for-device

      # Aguarda sair de offline
      for i in $(seq 1 60); do
        STATE=$(adb get-state 2>/dev/null || true)
        echo "ADB state: ${STATE:-unknown}"
        if [ "$STATE" = "device" ]; then
          break
        fi
        sleep 2
      done

      adb devices
      adb shell getprop sys.boot_completed || true

      echo "=== Appium ==="
      npx appium --log appium.log --base-path /wd/hub > appium-stdout.log 2>&1 &
      APPIUM_PID=$!
      sleep 8
      curl -s http://127.0.0.1:4723/wd/hub/status || true

      echo "=== Run tests ==="
      npm run test:android:ci 2>&1 | tee test-output.log

      kill $APPIUM_PID || true