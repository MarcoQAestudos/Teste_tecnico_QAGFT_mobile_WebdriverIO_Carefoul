name: Mobile Test Automation Pipeline - Banco Carrefour

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-tests:
    name: Run Android Mobile Tests (Appium + WebDriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 3. Configurar Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Instalar Dependências do Projeto
        run: npm ci

      - name: 5. Baixar APK do aplicativo native-demo-app
        run: |
          mkdir -p apps
          curl -L -o apps/android.wdio.native.app.v1.0.8.apk https://github.com/webdriverio/native-demo-app/releases/download/v1.0.8/android.wdio.native.app.v1.0.8.apk
          ls -la apps/

      - name: 6. Instalar Appium & Driver UiAutomator2 Globalmente
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 7. Executar Testes Mobile no Emulador Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          script: npm run test:android

      - name: 8. Gerar Relatório Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: 9. Upload dos Resultados e Evidências dos Testes (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-and-screenshots
          path: |
            allure-report/
            allure-results/
            logs/
          retention-days: 14