name: Mobile Test Automation Pipeline - Banco Carrefour

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-tests:
    name: Android Tests (Appium + WebDriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      NODE_OPTIONS: --max_old_space_size=4096
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 120

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 com cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Preparar APK Android
        run: |
          mkdir -p apps
          if [ ! -f apps/android.wdio.native.app.v1.0.8.apk ]; then
            curl -L --fail --retry 3 -o apps/android.wdio.native.app.v1.0.8.apk \
              https://github.com/webdriverio/native-demo-app/releases/download/v1.0.8/android.wdio.native.app.v1.0.8.apk
          fi
          ls -lh apps/

      - name: Executar smoke tests Android no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 8192 -netfast
          disable-animations: true
          script: |
            export PATH=$ANDROID_HOME/platform-tools:$PATH
            adb wait-for-device
            adb devices
            echo "Aguardando boot completo do emulador..."
            for i in {1..180}; do
              boot=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$boot" = "1" ]; then
                echo "✓ Emulador iniciado com sucesso!"
                break
              fi
              echo "Tentativa $i: Aguardando emulador..."
              sleep 1
            done
            adb shell getprop sys.boot_completed
            echo "Aguardando 10 segundos extras para garantir estabilidade..."
            sleep 10
            npm run test:android:ci

      - name: Gerar relatório Allure
        if: always()
        run: |
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report || true
          fi

      - name: Upload de artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-allure-report-and-logs
          path: |
            allure-report/
            allure-results/
            logs/
          retention-days: 14
          if-no-files-found: ignore