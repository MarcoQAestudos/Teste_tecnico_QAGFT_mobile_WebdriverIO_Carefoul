name: Mobile Tests (Android) - Final Stable

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android Tests (Appium + WebDriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      CI: true
      NODE_OPTIONS: --max_old_space_size=4096
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Debug environment (before emulator)
        run: |
          set -euxo pipefail
          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          npx wdio --version
          npx appium --version || true
          echo "Project files:"
          ls -la
          echo "Config files:"
          ls -la config || true
          echo "Spec files:"
          ls -la test/specs || true
          echo "Package scripts:"
          npm run

      - name: Prepare APK
        run: |
          set -euxo pipefail
          mkdir -p apps
          # Baixa apenas se não existir
          if [ ! -f apps/android.wdio.native.app.v1.0.8.apk ]; then
            curl -L --fail --retry 3 \
              -o apps/android.wdio.native.app.v1.0.8.apk \
              https://github.com/webdriverio/native-demo-app/releases/download/v1.0.8/android.wdio.native.app.v1.0.8.apk
          fi
          test -f apps/android.wdio.native.app.v1.0.8.apk
          ls -lah apps

      - name: Run Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            set -euxo pipefail

            echo "=== ADB / Emulator diagnostics ==="
            adb start-server
            adb wait-for-device
            adb devices
            adb shell getprop ro.build.version.release || true
            adb shell getprop ro.build.version.sdk || true
            adb shell getprop sys.boot_completed || true

            echo "=== Optional: start Appium log (if your wdio config starts service itself, this is just debug) ==="
            npx appium --log appium.log --base-path /wd/hub > appium-stdout.log 2>&1 &
            APPIUM_PID=$!
            sleep 8
            curl -s http://127.0.0.1:4723/wd/hub/status || true

            echo "=== Run tests ==="
            # Usa seu script atual; ideal com npx wdio no package.json
            npm run test:android:ci 2>&1 | tee test-output.log

            echo "=== Stop Appium ==="
            kill $APPIUM_PID || true

      - name: Generate Allure report
        if: always()
        run: |
          set +e
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report
          fi

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            test-output.log
            appium.log
            appium-stdout.log
            allure-results/
            allure-report/
            logs/
          if-no-files-found: ignore
          retention-days: 14