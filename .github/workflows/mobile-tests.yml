name: Mobile Tests (Android) - Final Stable (POSIX)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: mobile-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    name: Android Tests (Appium + WebDriverIO)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      NODE_OPTIONS: --max_old_space_size=4096
      ANDROID_DEVICE_NAME: emulator-5554
      ANDROID_SERIAL: emulator-5554

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Prepare APK
        run: |
          mkdir -p apps
          if [ ! -f apps/android.wdio.native.app.v1.0.8.apk ]; then
            curl -L --fail --retry 3 \
              -o apps/android.wdio.native.app.v1.0.8.apk \
              https://github.com/webdriverio/native-demo-app/releases/download/v1.0.8/android.wdio.native.app.v1.0.8.apk
          fi
          ls -lah apps/

      - name: Tornar script executavel
        run: chmod +x scripts/run-tests.sh

      - name: Run Android tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: bash scripts/run-tests.sh

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            allure-results/
            allure-report/
            logs/
          if-no-files-found: ignore
          retention-days: 14